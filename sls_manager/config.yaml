name: SLS
version: 0.1.11
slug: sls_manager
stage: experimental
description: Discover SLS controllers with LocalLink and manage their Home Assistant connection.
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:chip
panel_title: SLS
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: homeassistant
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
services:
  - mqtt:want
options:
  multicast_address: 224.0.0.50
  multicast_port: 8881
  interfaces: []
  poll_interval: 60
schema:
  multicast_address: str
  multicast_port: port
  interfaces:
    - str
  poll_interval: int(30,600)
url: https://github.com/slsys/sls-ha-app
