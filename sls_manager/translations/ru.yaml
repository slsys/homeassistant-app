configuration:
  multicast_address:
    name: Адрес LocalLink
    description: Multicast-адрес, настроенный на SLS. По умолчанию 224.0.0.50.
  multicast_port:
    name: UDP-порт LocalLink
    description: По умолчанию 8881.
  interfaces:
    name: Сетевые интерфейсы
    description: IPv4-адреса интерфейсов HAOS. Пустой список включает автоматический выбор.
  poll_interval:
    name: Интервал опроса
    description: Период чтения сведений о шлюзах в секундах, от 30 до 600.
  mqtt_mode:
    name: Подключение MQTT
    description: homeassistant — использовать MQTT-интеграцию HA (по умолчанию). direct — подключаться к брокеру напрямую. Автоматического переключения между режимами нет.
  mqtt_host:
    name: MQTT-хост для прямого подключения
    description: Только для direct. Адрес внешнего брокера без протокола и пути. Пустое поле использует MQTT-сервис Supervisor.
  mqtt_port:
    name: MQTT-порт
    description: Только для прямого подключения к указанному хосту. Обычно 1883, для TLS — 8883.
  mqtt_username:
    name: Пользователь MQTT
    description: Только для прямого подключения к указанному хосту.
  mqtt_password:
    name: Пароль MQTT
    description: Только для прямого подключения к указанному хосту. Не передаётся в интерфейс SLS.
  mqtt_tls:
    name: TLS для MQTT
    description: Только для прямого подключения к указанному хосту. Проверяются сертификат брокера и его имя.
  mqtt_protocol:
    name: Версия MQTT
    description: Только для прямого подключения к указанному хосту — 3.1.1 или 5.
  mqtt_discovery_prefix:
    name: Префикс HA Discovery
    description: Обычно homeassistant. Укажите префикс, используемый контроллерами.
  mqtt_scan_interval:
    name: Интервал расширенного MQTT-поиска
    description: Период в секундах (120–3600). При запуске и затем раз в этот период все топики прослушиваются 75 секунд для обнаружения неизвестных вложенных префиксов. Между окнами используются узкие подписки.
